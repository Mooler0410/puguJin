# one-time patch v2
name: Patch LLAL static-copy note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_llal_note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert highlighted source note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('blog/llal/index.html')
          s = p.read_text()
          css = '''\n.notion-source-note { margin: 0.25rem 0 1.5rem; padding: 0.75rem 1rem; border: 1.5px solid currentColor; border-radius: 6px; font-size: 0.95rem; font-weight: 600; opacity: 1; }\n.notion-source-note a { text-decoration: underline; font-weight: 700; }\n.notion-source-note a:hover { text-decoration-thickness: 2px; }\n'''
          title = '<h1 class="page-title" dir="auto">Mitigate Silent Expert Death in Ultra-Sparse MoE </h1>'
          note = '<p class="notion-source-note">This is a static copy of the <a href="https://alltoall.notion.site/save-lower-layer-moe-experts-llal">original Notion page</a>.</p>'
          style_anchor = '</style><link href="assets/prism.css" rel="stylesheet"/>'
          if title not in s or style_anchor not in s:
              raise SystemExit('Expected title/style anchor not found')
          if 'class="notion-source-note"' not in s:
              s = s.replace(style_anchor, css + style_anchor, 1)
              s = s.replace(title, title + note, 1)
          p.write_text(s)
          PY

      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch_llal_note.yml
          git add blog/llal/index.html
          git commit -m "Highlight static copy notice"
          git push
